# Jaipur Café Index (formerly Jaipur Café Pulse) — project config.
# Three data layers, kept apart on disk:
#   private/raw/      RAW: every source pull. Its own private git repo; never in this one.
#   private/reports/  PER-VENUE: owner reports, delivered privately. Also private.
#   data/public/      DERIVED AGGREGATES: the only layer the website reads.

site:
  title: "Jaipur Café Index"
  # what search engines and link previews show; plain words people actually search for
  tagline: "Independent data on cafés in Jaipur's C-Scheme and Malviya Nagar: what customers reward, where the gaps are, in plain words. Updated twice a month."
  seo_title: "Jaipur Café Index · Café data for C-Scheme & Malviya Nagar"
  areas: ["C-Scheme", "Malviya Nagar"]
  author:
    name: "Sarthak Oberoi"
    linkedin: "https://www.linkedin.com/in/sarthak-oberoi-analyst/"
    email: "sarthakoberoi12@gmail.com"
    email_subject: "Jaipur Café Index"
    # Sarthak's own words. {cafes} is replaced at build time with the current count of operating cafés.
    # bio_short opens "Get in touch" on the home page; bio_long is the full "Who's behind it" on the About page.
    bio_short:
      - "I'm Sarthak Oberoi. I grew up in Jaipur, and I study how businesses win and lose in markets like this one."
      - "I run this on my own, update it twice a month, and keep the research here free."
    bio_long:
      - "I'm Sarthak Oberoi. I grew up in Jaipur, and I study how businesses win and lose in markets like this one."
      - "In any market, someone is ahead of you because they know something you don't. That's the edge. It rarely sits in the big, obvious numbers everyone already watches. It usually hides in the part you'd never think to check: the hour you open, how your listing reads on one app, what a customer mentions in passing. Get a small thing like that right and it compounds. Get it wrong and it quietly costs you, every day, without you ever noticing."
      - "My work is finding that edge. I collect the right data, which is harder than collecting a lot of it. I run the analysis, from simple medians up to regressions that compare like with like, until a number stops being a coincidence. Then I keep going until every finding answers one question: so what should the person running the business do next?"
      - "Cafés came first because they're one of the most interesting markets in the city: {cafes} of them in two neighbourhoods, most with ten rivals a short walk away, where small details separate the ones that last. The method works for any business with a decision riding on a guess. If yours has one, I'd like to hear it."
      - "I run this on my own, update it twice a month, and keep the research here free."
  base_url: "https://sarthakkk23.github.io/jaipur-cafe-pulse"

publish:
  # Any aggregate built from fewer venues than this is suppressed (shown as "fewer than N").
  min_group_size: 10
  # A venue may not hold more than this share of any published total.
  max_single_venue_share: 0.25
  # Venue names may appear on the site only through approved entries in content/kudos.yaml.
  names_only_via_kudos: true
  # false: the biweekly task stops at a draft for review. true: it builds and deploys.
  auto_publish: true   # set 17 Oct 2026 by Sarthak: merge refreshes when every check passes

# Free twice-a-month updates on WhatsApp. The site is static, so sign-ups (a mobile number only) post to a Google Form that writes to Sarthak's own
# Google Sheet. The section stays off the public page until provider and action are set.
#   provider: google_form | formspree | none
#   action:   the form's .../formResponse URL (Google) or the Formspree endpoint
#   fields:   the form's field names: name (optional on the page if the form has no name question) and contact
subscribe:
  provider: google_form
  action: "https://docs.google.com/forms/d/e/1FAIpQLSdYhCWKQVk3wV8bSlXn7jHBZxEs7hlxZxjSh_ZU1ct7S6T2cw/formResponse"
  fields:                 # the form's two required questions
    name: entry.564559113       # Name
    contact: entry.1429636324   # Mobile Number

cadence:
  every: "2 weeks"
  weekday: "Monday"
  time_ist: "11:00"

# Collection modules. Each can be switched off with one line.
# DECISION PENDING (spec 0.3): which platforms stay on for live runs.
sources:
  zomato: true
  google_maps_ui: true
  google_demand: true        # offices, colleges, gyms, coworking… around each spot (location check)
  google_places_api: false   # live lookups only; never stored (Google terms)
  swiggy: true
  magicpin: true
  google_trends: true        # monthly
  news_sweep: true           # monthly

baseline:
  snapshot_label: "2026-09"
  captured_on: "2026-09-25"
  dataset_xlsx: "private/raw/2026-09/FIG_Jaipur_Cafe_Dataset_2026-09_v2.xlsx"
  research_xlsx: "private/raw/2026-09/FIG_Jaipur_Cafe_Market_Research_2026-09.xlsx"
