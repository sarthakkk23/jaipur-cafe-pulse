# The only place a café may be named on the public site.
#
# Rules (enforced by pipeline/check_publish.py):
#   - Praise only, built from published facts (press, the café's own announcements)
#     or a visit by Sarthak. Never a platform rating, review count, price or rank.
#   - Every entry has at least one source with a URL and a date.
#   - approved: false entries appear only in draft builds. Sarthak flips them to
#     true (with approved_on) after checking each fact against its source.
#
# These five were drafted from the September 2026 research workbook (labelled [Known]
# there). Re-read each source before approving.

entries:
  - id: curious-life
    name: "Curious Life Coffee Roasters"
    area: "C-Scheme"
    praise: >-
      Roasting its own coffee in Jaipur since 2015, when its first café opened at Deer
      Park. A second café followed on Sarojini Marg in December 2018, and the roastery
      supplies other cafés too.
    sources:
      - publication: "Barista Magazine"
        title: "A Guide to the Jaipur Coffee Scene"
        url: "https://www.baristamagazine.com/a-guide-to-the-jaipur-coffee-scene/"
        date: "2026-08"
      - publication: "Scroll.in"
        title: "An ex-Army man in Jaipur is making incredible specialty coffee"
        url: "https://scroll.in/magazine/831086/an-ex-army-man-in-jaipur-is-making-incredible-specialty-coffee-thats-part-science-part-art"
        date: "2017-03-28"
    approved: false
    approved_on: null

